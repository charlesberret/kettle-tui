[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "kettle-tui"
version = "0.0.1"
description = "Spike: Textual TUI viewport for the Kettle review desk"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Charles Berret" }]
dependencies = [
  "textual>=1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.8",
]

[project.scripts]
kettle-tui = "kettle_tui.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint.per-file-ignores]
# In-flight viewport work on another branch; keep lint clean without editing here yet.
"src/kettle_tui/app.py" = ["BLE001", "I001", "RUF012", "RUF100", "S110", "SIM102", "SIM103"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
