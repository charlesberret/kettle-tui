[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "kettle-cli"
version = "0.0.1"
description = "Spike: Textual TUI viewport for the Kettle review desk"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Charles Berret" }]
dependencies = [
  "textual>=1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
]

[project.scripts]
kettle-tui = "kettle_cli.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
